llm:
  provider: "ollama"
  ollama:
    base_url: "http://localhost:11434"
    model: "dolphin-llama3:8b"
  cloud:
    api_key: ""
    model: "claude-3-5-sonnet-20241022"

qemu:
  base_image: "/var/lib/libvirt/images/kali-base.qcow2"
  overlay_path: "/tmp/zhc-active-session.qcow2"
  xml_config: "deploy/qemu/vm-config.xml"

transport:
  socket_path: "/tmp/mcp-guest-agent.sock"
  ssh:
    host: "localhost"
    port: 2222
    user: "root"
    key_path: "~/.ssh/id_rsa"
